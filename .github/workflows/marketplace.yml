name: marketplace

on:
  push:
    branches: [main]
    paths:
      - 'apps/marketplace/**'
      - 'packages/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/marketplace/**'
      - 'packages/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate catalog
        run: pnpm run catalog:validate

      - name: Check design tokens
        run: pnpm run tokens:check

      - name: Run marketplace tests
        run: pnpm --filter @pinkless/marketplace test

      - name: Build marketplace
        run: pnpm --filter @pinkless/marketplace build
